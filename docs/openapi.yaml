openapi: 3.0.1
info:
  title: SEGURPLAN API
  version: 6.5.0
  description: 'API REST de SEGURPLAN. Documento estático generado desde el código; la versión viva está en /v3/api-docs.


    **Cómo probar:** 1) GET /api/csrf y copie `token`; 2) POST /api/usuarios/login; 3) Authorize → pegue el token en `csrf`; 4) POST/PUT/DELETE
    envían X-CSRF-TOKEN.'
servers:
- url: http://localhost:8080
  description: Local
tags:
- name: Autenticación
  description: Registro, inicio de sesión y rutas heredadas de administración de usuarios.
- name: Mi perfil
  description: Datos personales y cambio de contraseña del usuario en sesión.
- name: Catálogos
  description: Tipos de seguro y aseguradoras activos, para los formularios.
- name: Cotizaciones
  description: Solicitud, consulta y respuesta de cotizaciones.
- name: Contrataciones
  description: Contrataciones de seguros (uso del personal).
- name: Pagos (simulados)
  description: Pago simulado con tarjeta, Yape o Plin. No cobra dinero real.
- name: Pólizas
  description: Emisión y consulta de pólizas.
- name: AFP / Previsión
  description: Simulación de pensión y orientación AFP.
- name: Siniestros
  description: Registro, seguimiento y gestión de siniestros.
- name: Documentos
  description: Evidencias de siniestros y adjuntos de cotización.
- name: Notificaciones
  description: Avisos internos del usuario (campana).
- name: Mis procesos
  description: Historial unificado del cliente y su siguiente paso.
- name: Reportes (JSON)
  description: Datos de los reportes para pantalla y exportación. Solo Administrador.
- name: Reportes PDF (JasperReports)
  description: Reportes en PDF generados en el servidor con plantillas .jrxml.
- name: Admin · Usuarios
  description: Gestión de usuarios, estados y roles.
- name: Admin · Asesores
  description: Alta y mantenimiento de asesores.
- name: Admin · Roles y permisos
  description: Roles, matriz de permisos y actividad.
- name: Admin · Catálogos
  description: Mantenimiento de aseguradoras y tipos de seguro.
- name: Admin · Historial
  description: Bitácora de cambios (inmutable).
- name: Admin · Respaldos
  description: Respaldo, descarga y restauración de la base de datos.
paths:
  /api/admin/asesores:
    get:
      tags:
      - Admin · Asesores
      summary: Listar asesores
      description: '**Roles:** Administrador. Incluye el área de especialidad.'
      operationId: AsesorAdminController_listarAsesores_get
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 'Datos inválidos o regla de negocio incumplida ({"mensaje": ...}).'
        '401':
          description: No hay sesión iniciada.
        '403':
          description: El rol no alcanza o el registro pertenece a otro usuario.
    post:
      tags:
      - Admin · Asesores
      summary: Registrar un asesor
      description: '**Roles:** Administrador. Área de especialidad: Ventas, Siniestros o AFP.'
