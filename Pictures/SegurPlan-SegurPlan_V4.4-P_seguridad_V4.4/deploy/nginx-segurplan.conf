# Proxy inverso + TLS para SegurPlan. Ajustar server_name y rutas de los certificados.
# Certificado: sudo certbot --nginx -d app.example.edu
server {
    listen 80;
    server_name app.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.edu;

    ssl_certificate     /etc/letsencrypt/live/app.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.edu/privkey.pem;

    # La aplicación acepta cargas de hasta 100 MB (videos de evidencia)
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
