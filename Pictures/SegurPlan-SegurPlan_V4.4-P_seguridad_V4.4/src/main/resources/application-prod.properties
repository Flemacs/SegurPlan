# Perfil de producción (se activa al compilar con -Pprod o con SPRING_PROFILES_ACTIVE=prod)
# Swagger apagado salvo que se active expresamente con SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
