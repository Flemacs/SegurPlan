<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEGURPLAN — Simulación AFP</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
<header class="site-header">
  <div class="logo">SEGURPLAN<span>Plataforma de seguros y AFP</span></div>
  <div class="header-right">
    <span class="user-name">Usuario: Juan García</span>
    <button class="bell-btn" title="Notificaciones">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="profile-btn">MI PERFIL</button>
  </div>
</header>

<div class="page-wrap narrow">
  <nav class="breadcrumb">SEGURPLAN &rsaquo; AFP &rsaquo; Simulación</nav>
  <h1 class="page-title">Simulación AFP</h1>

  <div class="notice info" id="perfil-notice" style="margin-bottom:20px;"></div>

  <div class="card">
    <div class="card-header">
      <h2>Ingreso de datos</h2>
    </div>
    <div class="card-body">
      <form id="afp-form" onsubmit="simularAFP(event)">
        <div class="form-group">
          <label for="sim-edad">Edad</label>
          <input class="form-control" type="number" id="sim-edad" min="18" max="99" placeholder="65" />
        </div>
        <div class="form-group">
          <label for="sim-anios">Años de aporte</label>
          <input class="form-control" type="number" id="sim-anios" placeholder="20" />
        </div>
        <div class="form-group">
          <label for="sim-fondo">Fondo acumulado (S/)</label>
          <input class="form-control" type="number" id="sim-fondo" placeholder="120000" />
        </div>
        <div class="form-group">
          <label for="sim-aporte">Aporte mensual aproximado (S/)</label>
          <input class="form-control" type="number" id="sim-aporte" placeholder="500" />
        </div>
      </form>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" type="submit" form="afp-form">SIMULAR</button>
      <button class="btn btn-outline" onclick="history.back()">← Volver</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-brand">SEGURPLAN<span>Plataforma de seguros y AFP</span></div>
  <nav class="footer-links">
    <a href="../index.html">Inicio</a>
    <a href="s01-login.html">Iniciar sesión</a>
    <a href="s00-registro.html">Registrarse</a>
  </nav>
  <div class="footer-meta">
    <span>© 2026 SEGURPLAN. Todos los derechos reservados.</span>
  </div>
</footer>
<script src="../assets/app.js"></script>
<script src="../assets/s07.js"></script>
<script>
  const p = sessionStorage.getItem('afp_perfil');
  const notice = document.getElementById('perfil-notice');
  if (p === 'nuevo') notice.textContent = 'Perfil: Nuevo Inversor — Simulación previsional';
  else notice.textContent = 'Perfil: Persona de Tercera Edad — Estimación de pensión';
</script>
</body>
</html>
