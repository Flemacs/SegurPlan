spring.application.name=segurplan

# ---------------------------------------------------------------
# POSTGRESQL (configurable por variables de entorno; los valores
# por defecto sirven para ejecución local)
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SegurPlan}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:emer}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
# SQL en consola solo si se activa: SHOW_SQL=true (por defecto apagado)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# ---------------------------------------------------------------
# SERVIDOR (PORT lo definen Render/Railway/Heroku automáticamente)
# ---------------------------------------------------------------
server.port=${PORT:8080}
# Necesario detrás de un proxy HTTPS (Render, Railway, Nginx...)
server.forward-headers-strategy=framework

# ---------------------------------------------------------------
# SESIÓN Y COOKIES (RNF04 - seguridad)
# COOKIE_SECURE=true cuando se publique con HTTPS
# ---------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# HTTPS directo (opcional): SSL_ENABLED=true + SSL_KEYSTORE + SSL_KEYSTORE_PASSWORD
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}

# ---------------------------------------------------------------
# SUBIDA DE ARCHIVOS
# El servicio valida 10 MB para PDF/JPG/PNG (RF009); el tope técnico
# permite además los videos de evidencia de siniestros.
# ---------------------------------------------------------------
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# ---------------------------------------------------------------
# RESPALDO / BACKUP DE LA BASE DE DATOS (RNF09)
# PG_BIN_DIR: carpeta con pg_dump y psql. Vacío = usar el PATH
# (Linux/Docker). En Windows local se usa la ruta por defecto.
# ---------------------------------------------------------------
segurplan.backup.dir=${BACKUP_DIR:./backups}
segurplan.backup.pg-bin-dir=${PG_BIN_DIR:C:/Program Files/PostgreSQL/18/bin}

# Respaldo automático cada 6 horas (02:00, 08:00, 14:00 y 20:00)
segurplan.backup.auto-enabled=true
segurplan.backup.cron=0 0 2,8,14,20 * * *
segurplan.backup.retention-days=30

# LOGS: Spring Boot detecta logback-spring.xml automáticamente.
# Carpeta de logs: variable de entorno LOG_DIR (por defecto ./logs)
