spring.application.name=segurplan

# POSTGRESQL

spring.datasource.url=jdbc:postgresql://localhost:5432/SegurPlan
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:emer}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
# SQL en consola solo si se activa: SHOW_SQL=true (por defecto apagado)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# SERVIDOR

server.port=8080

# SUBIDA DE ARCHIVOS

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# RESPALDO / BACKUP DE LA BASE DE DATOS

segurplan.backup.dir=./backups
segurplan.backup.pg-bin-dir=C:/Program Files/PostgreSQL/18/bin

# RESPALDO AUTOMATICO DIARIO A LAS 02:00

segurplan.backup.auto-enabled=true
segurplan.backup.cron=0 0 2 * * *
segurplan.backup.retention-days=30

# LOGS: Spring Boot detecta logback-spring.xml automáticamente.
# Carpeta de logs: variable de entorno LOG_DIR (por defecto ./logs)
